{{define "content"}}
<h1>{{t "safe.title"}}</h1>
<p class="muted">{{t "safe.intro"}}</p>
{{template "errors" .}}
<form method="post" action="/safe">
<label for="name">{{t "safe.name"}}</label>
<input id="name" name="name" value="{{.Form.Name}}" required maxlength="120" autocomplete="name">

<label for="others">{{t "safe.others"}}</label>
<textarea id="others" name="others" rows="2" maxlength="1000" placeholder="{{t "safe.others_placeholder"}}">{{.Form.Others}}</textarea>

<label for="message">{{t "safe.message"}}</label>
<textarea id="message" name="message" maxlength="500" placeholder="{{t "safe.message_placeholder"}}">{{.Form.Message}}</textarea>

{{template "visibility" .Vis}}

<label for="contact">{{t "form.contact"}}</label>
<input id="contact" name="contact" value="{{.Form.Contact}}" maxlength="120">
<small>{{t "form.contact_help"}}</small>
{{template "honeypot"}}
<button class="btn-safe" type="submit">{{template "check"}}{{t "safe.submit"}}</button>
</form>
{{end}}
