{{define "rnav"}}
<nav class="tabs" aria-label="{{t "nav.dashboard"}}">
<a class="btn alt sm" href="/responders">{{t "r.records"}}</a>
<a class="btn alt sm" href="/responders/matches">{{t "r.matches"}}</a>
<a class="btn alt sm" href="/responders/new">{{t "r.new"}}</a>
<a class="btn alt sm" href="/responders/data">{{t "r.data"}}</a>
{{if .User.IsAdmin}}<a class="btn alt sm" href="/responders/users">{{t "r.users"}}</a><a class="btn alt sm" href="/responders/audit">{{t "r.audit"}}</a>{{end}}

</nav>
{{end}}
