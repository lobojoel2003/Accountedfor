{{define "content"}}
<h1>{{t "missing.title"}}</h1>
<p class="muted">{{t "missing.intro"}}</p>
{{template "errors" .}}
<form method="post" action="/missing">
<label for="name">{{t "missing.name"}}</label>
<input id="name" name="name" value="{{.Form.Name}}" required maxlength="120">

<div class="row">
<div><label for="age">{{t "missing.age"}}</label><input id="age" name="age" value="{{.Form.Age}}" maxlength="20" inputmode="numeric"></div>
<div><label for="home">{{t "missing.home"}}</label><input id="home" name="home" value="{{.Form.Home}}" maxlength="120" placeholder="{{t "missing.home_placeholder"}}"></div>
</div>

<label for="last_seen">{{t "missing.last_seen"}}</label>
<input id="last_seen" name="last_seen" value="{{.Form.LastSeen}}" maxlength="200" placeholder="{{t "missing.last_seen_placeholder"}}">

<label for="description">{{t "missing.description"}}</label>
<textarea id="description" name="description" maxlength="1000" placeholder="{{t "missing.description_placeholder"}}">{{.Form.Description}}</textarea>

<label for="author">{{t "missing.author"}}</label>
<input id="author" name="author" value="{{.Form.Author}}" required maxlength="120" autocomplete="name">

<label for="contact">{{t "form.contact"}}</label>
<input id="contact" name="contact" value="{{.Form.Contact}}" maxlength="120">
<small>{{t "missing.contact_help"}}</small>

{{template "visibility" .Vis}}
{{template "honeypot"}}
<button type="submit">{{t "missing.submit"}}</button>
</form>
{{end}}
