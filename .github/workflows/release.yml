name: Release

# Publishes a release:
#   - binaries for Linux, macOS and Windows with SHA256SUMS
#   - a multi-arch image ghcr.io/<owner>/accountedfor:1.2.3, :1.2, :1, :latest
#   - build provenance attestations for both
#   - a GitHub Release whose notes come from CHANGELOG.md
#
# Start it either way:
#   - push a tag:  git tag -a v1.2.3 -m "Accountedfor v1.2.3" && git push origin v1.2.3
#   - or Actions > Release > Run workflow on main with version "v1.2.3";
#     the workflow then creates the tag on the commit it built.
#
# The workflow run number is stamped into every artifact as the build number.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v1.2.3 (needs a section in CHANGELOG.md)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ACCOUNTEDFOR_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Version is semantic and documented
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$VERSION is not a semantic version (vMAJOR.MINOR.PATCH[-PRERELEASE])"
            exit 1
          fi
          scripts/release-notes.sh "$VERSION" > /dev/null
      - name: Manual releases come from main and use a new tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Run the release workflow on main, not $GITHUB_REF"
            exit 1
          fi
          if [[ -n "$(git ls-remote --tags origin "refs/tags/${VERSION}")" ]]; then
            echo "::error::Tag ${VERSION} already exists"
            exit 1
          fi
      - name: Test
        run: go test -race ./...

  binaries:
    name: Binaries
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/build-release.sh
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/
          retention-days: 7

  image:
    name: Container image
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/accountedfor
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }}
            type=semver,pattern={{major}},value=${{ env.VERSION }}
            type=raw,value=latest,enable=${{ !contains(env.VERSION, '-') }}
            type=raw,value=build-${{ github.run_number }}
          labels: |
            org.opencontainers.image.title=Accountedfor
            org.opencontainers.image.licenses=Apache-2.0
      - name: Build date
        id: date
        run: echo "now=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ github.sha }}
            BUILD_NUMBER=${{ github.run_number }}
            BUILD_DATE=${{ steps.date.outputs.now }}
      - name: Attest image provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [binaries, image]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist
      - name: Write release notes
        env:
          RUN: ${{ github.run_number }}
          OWNER: ${{ github.repository_owner }}
        run: |
          {
            scripts/release-notes.sh "$VERSION"
            echo
            echo "## Install"
            echo
            echo "**Docker** (multi-arch: linux/amd64, linux/arm64)"
            echo
            echo '```bash'
            echo "docker pull ghcr.io/${OWNER}/accountedfor:${VERSION#v}"
            echo '```'
            echo
            echo "**Docker Compose**: download \`docker-compose.yml\` and \`.env.example\` from any archive below, then \`cp .env.example .env && docker compose up -d\`."
            echo
            echo "**Binary**: download the archive for your platform, verify it with \`sha256sum -c SHA256SUMS\` (or \`gh attestation verify <file> --repo ${GITHUB_REPOSITORY}\`), and run \`accountedfor serve\` with \`DATABASE_URL\` set."
            echo
            echo "---"
            echo "Version \`${VERSION}\` · build ${RUN} · commit \`${GITHUB_SHA::7}\`"
          } > notes.md
          cat notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); else flags+=(--latest); fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            # Creates the tag on the commit this run built and tested.
            flags+=(--target "$GITHUB_SHA")
          else
            flags+=(--verify-tag)
          fi
          gh release create "$VERSION" dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
            --title "Accountedfor ${VERSION}" \
            --notes-file notes.md \
            "${flags[@]}"
