name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Who is this for and what problem does it solve?
      description: For example "shelter volunteers entering paper sign-in sheets".
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
  - type: checkboxes
    id: principles
    attributes:
      label: Principles
      options:
        - label: This keeps public pages light (no JavaScript, fonts or images).
        - label: This respects each person's privacy choice.
